# =============================================================================
# SWIPE-UP CONTROLS FOR LIGHTING AND SCENES
# =============================================================================
# Adds swipe-up functionality to access lighting controls and scenes
# Configure entities through Home Assistant device settings
# =============================================================================

# Text sensors for storing entity IDs (set these in Home Assistant device settings)
text_sensor:
  - platform: template
    id: light_1_entity
    name: "Light 1 Entity"
    update_interval: never
    entity_category: "config"
  - platform: template
    id: light_2_entity
    name: "Light 2 Entity"
    update_interval: never
    entity_category: "config"
  - platform: template
    id: light_3_entity
    name: "Light 3 Entity"
    update_interval: never
    entity_category: "config"
  - platform: template
    id: scene_1_entity
    name: "Scene 1 Entity"
    update_interval: never
    entity_category: "config"
  - platform: template
    id: scene_2_entity
    name: "Scene 2 Entity"
    update_interval: never
    entity_category: "config"

# Animation for sliding the controls panel in and out
animation:
  - id: slide_up_animation
    duration: 300
    playback: once
    repeat: 0
    start_value: 480
    end_value: 280
    on_progress:
      - lvgl.widget.update:
          id: controls_panel
          y: !lambda |-
            return (int)x;
  
  - id: slide_down_animation
    duration: 300
    playback: once
    repeat: 0
    start_value: 280
    end_value: 480
    on_progress:
      - lvgl.widget.update:
          id: controls_panel
          y: !lambda |-
            return (int)x;

# Variable to track panel state
globals:
  - id: panel_visible
    type: bool
    initial_value: 'false'

# Script to toggle the visibility of the controls panel
script:
  - id: toggle_controls_panel
    then:
      - lambda: |-
          if (id(panel_visible)) {
            id(slide_down_animation).start();
            id(panel_visible) = false;
          } else {
            id(slide_up_animation).start();
            id(panel_visible) = true;
          }
          
  - id: show_controls_panel
    then:
      - lvgl.widget.update:
          id: controls_panel
          y: 280
      - lambda: |-
          id(panel_visible) = true;
          
  - id: hide_controls_panel
    then:
      - lvgl.widget.update:
          id: controls_panel
          y: 480
      - lambda: |-
          id(panel_visible) = false;

# Additional LVGL components for swipe detection and controls panel
lvgl:
  widgets:
    # Swipe detection area at the bottom of the screen
    - obj:
        id: swipe_detection_area
        x: 0
        y: 430  # Positioned at the bottom (480px height - 50px height)
        width: 480
        height: 50
        clickable: true
        event_handlers:
          on_click:
            - logger.log: "Swipe detection area clicked"
            - script.execute: toggle_controls_panel
        widgets:
          - label:
              text: "Swipe Up for Controls"
              align: center
              x: 0
              y: 15
              width: 480
              text_align: center
              text_color: 0xAAAAAA
              text_font: roboto14_font
    
    # Controls panel that appears when swiped up
    - obj:
        id: controls_panel
        x: 0
        y: 480  # Initially hidden below the screen
        width: 480
        height: 200
        bg_color: 0x1a1a1a
        bg_opa: 100%
        border_width: 1
        border_color: 0x333333
        radius: 10
        clickable: true
        widgets:
          # Header with title
          - label:
              text: "Room Controls"
              align: center
              x: 0
              y: 10
              width: 480
              text_align: center
              text_font: roboto22_font
              text_color: 0xFFFFFF
          
          # Close button
          - button:
              id: close_controls_button
              x: 440
              y: 10
              width: 30
              height: 30
              bg_color: 0xFF0000
              bg_opa: 80%
              border_width: 0
              radius: 15
              clickable: true
              event_handlers:
                on_click:
                  - script.execute: toggle_controls_panel
              widgets:
                - label:
                    text: "X"
                    align: center
                    text_color: 0xFFFFFF
                    text_font: roboto16_font
          
          # Section headers
          - label:
              text: "Lights"
              x: 20
              y: 50
              text_color: 0xCCCCCC
              text_font: roboto16_font
          
          - label:
              text: "Scenes"
              x: 250
              y: 50
              text_color: 0xCCCCCC
              text_font: roboto16_font
          
          # Light control buttons (configured via Home Assistant)
          - button:
              id: light1_button
              x: 20
              y: 80
              width: 70
              height: 70
              bg_color: 0x333333
              bg_opa: 100%
              border_width: 1
              border_color: 0x555555
              radius: 35
              clickable: true
              event_handlers:
                on_click:
                  - if:
                      condition:
                        lambda: 'return strlen(id(light_1_entity).state.c_str()) > 0;'
                      then:
                        - homeassistant.service:
                            service: light.toggle
                            data:
                              entity_id: !lambda 'return id(light_1_entity).state;'
              widgets:
                - label:
                    text: "Light 1"
                    align: center
                    y: 15
                    width: 70
                    text_align: center
                    text_color: 0xFFFFFF
                    text_font: roboto14_font
          
          - button:
              id: light2_button
              x: 100
              y: 80
              width: 70
              height: 70
              bg_color: 0x333333
              bg_opa: 100%
              border_width: 1
              border_color: 0x555555
              radius: 35
              clickable: true
              event_handlers:
                on_click:
                  - if:
                      condition:
                        lambda: 'return strlen(id(light_2_entity).state.c_str()) > 0;'
                      then:
                        - homeassistant.service:
                            service: light.toggle
                            data:
                              entity_id: !lambda 'return id(light_2_entity).state;'
              widgets:
                - label:
                    text: "Light 2"
                    align: center
                    y: 15
                    width: 70
                    text_align: center
                    text_color: 0xFFFFFF
                    text_font: roboto14_font
          
          - button:
              id: light3_button
              x: 180
              y: 80
              width: 70
              height: 70
              bg_color: 0x333333
              bg_opa: 100%
              border_width: 1
              border_color: 0x555555
              radius: 35
              clickable: true
              event_handlers:
                on_click:
                  - if:
                      condition:
                        lambda: 'return strlen(id(light_3_entity).state.c_str()) > 0;'
                      then:
                        - homeassistant.service:
                            service: light.toggle
                            data:
                              entity_id: !lambda 'return id(light_3_entity).state;'
              widgets:
                - label:
                    text: "Light 3"
                    align: center
                    y: 15
                    width: 70
                    text_align: center
                    text_color: 0xFFFFFF
                    text_font: roboto14_font
          
          # Scene buttons (configured via Home Assistant)
          - button:
              id: scene1_button
              x: 270
              y: 80
              width: 70
              height: 70
              bg_color: 0x336699
              bg_opa: 100%
              border_width: 1
              border_color: 0x555555
              radius: 35
              clickable: true
              event_handlers:
                on_click:
                  - if:
                      condition:
                        lambda: 'return strlen(id(scene_1_entity).state.c_str()) > 0;'
                      then:
                        - homeassistant.service:
                            service: scene.turn_on
                            data:
                              entity_id: !lambda 'return id(scene_1_entity).state;'
              widgets:
                - label:
